<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ulaznice · u izradi</title>
<style>
  :root { color-scheme: light dark; --bg:#fafaf7; --fg:#1c1c1a; --muted:#6b6b66; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#f0efe9; --muted:#a3a29b; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:0 16px; }
  main { max-width:32rem; }
  h1 { font-size:1.5rem; margin:0 0 .5rem; }
  p { margin:0; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Ulaznice · u izradi</h1>
  <p>Nova stranica za kupnju ulaznica još se gradi. Prodaja ovdje ne radi.</p>
</main>
</body>
</html>
